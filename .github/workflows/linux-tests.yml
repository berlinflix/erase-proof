name: Linux engine and native desktop
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  ubuntu:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: pip
      - name: Install filesystem and desktop runtime tools
        run: |
          sudo apt-get update
          sudo apt-get install -y dosfstools mtools sleuthkit testdisk gcc libext2fs-dev e2fsprogs ntfs-3g exfatprogs ffmpeg p7zip-full nvme-cli hdparm cryptsetup-bin libegl1 libopengl0
      - name: Build bounded native I/O and ext4 adapter
        run: bash scripts/build-native.sh
      - name: Install project
        run: python -m pip install -e '.[desktop,test]'
      - name: Test native engine and Qt workflow
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m pytest -q
