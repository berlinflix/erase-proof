name: Linux engine and native desktop
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  ubuntu:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: pip
      - name: Install filesystem and desktop runtime tools
        run: |
          sudo apt-get update
          sudo apt-get install -y dosfstools mtools sleuthkit testdisk gcc libext2fs-dev ntfs-3g-dev e2fsprogs ntfs-3g exfatprogs exfat-fuse ffmpeg p7zip-full nvme-cli hdparm cryptsetup-bin libegl1 libopengl0 libglib2.0-bin curl autoconf automake build-essential flex libtool pkg-config libabsl-dev libexpat1-dev libgcrypt20-dev libgpg-error-dev libre2-dev libssl-dev zlib1g-dev
      - name: Build bounded native I/O and filesystem adapters
        run: bash scripts/build-native.sh
      - uses: actions/cache@v4
        with:
          path: ~/.cache/eraseproof/vendor
          key: bulk-extractor-2.2.0-ubuntu22-x64-b9e15d40
      - name: Build and test checksum-pinned independent feature scanner
        run: bash scripts/build-forensic-tools.sh
      - name: Install project
        run: python -m pip install -e '.[desktop,test]'
      - name: Test native engine and Qt workflow
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m pytest -q
      - name: Recover independently generated files after ordinary OS deletion
        run: sudo "$(command -v python)" scripts/verify-normal-deletion.py --output qa/normal-deletion
      - name: Validate filesystem cleanup through actual mounted-driver fixtures
        run: sudo unshare --mount --propagation private env ERASEPROOF_TEST_PRIVATE_MOUNTS=1 QT_QPA_PLATFORM=offscreen "$(command -v python)" -m pytest tests/test_fat32.py tests/test_exfat.py tests/test_desktop.py -q
